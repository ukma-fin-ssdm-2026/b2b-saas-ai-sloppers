components:
  responses:
    BadRequest:
      content:
        application/json:
          example:
            error:
              code: VALIDATION_ERROR
              details:
              - field: slug
                message: "Slug: 3–50 символів, лише a-z, 0-9 і дефіс"
                providedValue: Debate Club!
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#validation-error
              message: Запит містить невалідні поля
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Невалідні параметри або тіло запиту (VALIDATION_ERROR, INVALID_PARAMETER,\
        \ MALFORMED_REQUEST)"
    Conflict:
      content:
        application/json:
          example:
            error:
              code: SLUG_ALREADY_EXISTS
              details:
              - field: slug
                message: Slug зайнятий
                providedValue: debate-club
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#slug-already-exists
              message: Організація з таким slug уже існує
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Конфлікт зі станом ресурсу (SLUG_ALREADY_EXISTS)
    Forbidden:
      content:
        application/json:
          example:
            error:
              code: FORBIDDEN
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#forbidden
              message: Дія доступна лише голові цієї організації
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Роль користувача не дозволяє цю дію (FORBIDDEN)
    MailUnavailable:
      content:
        application/json:
          example:
            error:
              code: MAIL_UNAVAILABLE
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#mail-unavailable
              message: Не вдалося надіслати лист з кодом
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Не вдалося надіслати лист з кодом (MAIL_UNAVAILABLE)
    NotFound:
      content:
        application/json:
          example:
            error:
              code: ORGANIZATION_NOT_FOUND
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#organization-not-found
              message: Організацію не знайдено
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Ресурс не знайдено (ORGANIZATION_NOT_FOUND)
    PayloadTooLarge:
      content:
        application/json:
          example:
            error:
              code: PAYLOAD_TOO_LARGE
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#payload-too-large
              message: "Файл завеликий: не більше 5 МБ"
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Файл більший за 5 МБ (PAYLOAD_TOO_LARGE)
    StorageUnavailable:
      content:
        application/json:
          example:
            error:
              code: STORAGE_UNAVAILABLE
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#storage-unavailable
              message: Не вдалося зберегти файл у сховищі
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Файлове сховище недоступне або не налаштоване (STORAGE_UNAVAILABLE)
    TooManyRequests:
      content:
        application/json:
          example:
            error:
              code: TOO_MANY_REQUESTS
