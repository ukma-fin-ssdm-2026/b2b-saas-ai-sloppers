openapi: 3.1.0
info:
  contact:
    name: Команда Student Community
  description: "API мікросервісу «Студентське ком'юніті та Івенти» (екосистема SmartUKMA):\
    \ каталог студентських організацій. Специфікація згенерована з коду (Code-First).\
    \ Відповіді — заглушки з пам'яті процесу."
  title: Student Community & Events API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8080
tags:
- description: "Реєстрація з поштою @ukma.edu.ua, вхід, поточний користувач"
  name: Auth
- description: Каталог студентських організацій
  name: Organizations
- description: Голови організацій і журнал змін ролей
  name: Heads
- description: "Дошка оголошень: пошук команди чи компанії, відгуки"
  name: Board
paths:
  /api/v1/adverts:
    get:
      description: "Лише відкриті оголошення (ACTIVE і дедлайн не минув), найновіш\
        і спершу; фільтр за типом (FR-045, FR-052). Контакт автора тут бачить лише\
        \ сам автор і підтверджені відгукувачі."
      operationId: listAdverts
      parameters:
      - description: Лише цей тип
        example: TEAM
        in: query
        name: type
        required: false
        schema:
          type: string
          enum:
          - TEAM
          - LEISURE
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageAdvertResponse"
          description: Сторінка оголошень
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Активні оголошення
      tags:
      - Board
    post:
      description: "FR-043, FR-044: тип, заголовок, опис, кількість місць, дедлайн\
        \ у майбутньому й контакт (Telegram, телефон або email)."
      operationId: createAdvert
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvertCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdvertResponse"
          description: Оголошення створено
          headers:
            Location:
              description: URL нового оголошення
              schema:
                type: string
                format: uri
              style: simple
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Створити оголошення
      tags:
      - Board
  /api/v1/adverts/mine:
    get:
      description: "Оголошення поточного користувача, активні й закриті, найновіші\
        \ спершу."
      operationId: listMyAdverts
      parameters:
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageAdvertResponse"
          description: Сторінка оголошень
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Мої оголошення
      tags:
      - Board
  /api/v1/adverts/replied:
    get:
      description: "Зокрема закриті: після підтвердження відгуку тут видно контакт\
        \ автора (FR-049, US-013)."
      operationId: listRepliedAdverts
      parameters:
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageAdvertResponse"
          description: Сторінка оголошень
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: "Оголошення, на які я відгукнувся"
      tags:
      - Board
  /api/v1/adverts/{advertId}:
    delete:
      description: Автор (FR-051). Оголошення зникає для всіх; рядок лишається в базі
        зі статусом DELETED.
      operationId: deleteAdvert
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Оголошення видалено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      summary: Видалити оголошення
      tags:
      - Board
    get:
      description: Активне або закрите; видалене повертає 404. Контакт — лише автору
        й підтвердженому відгукувачу (FR-049).
      operationId: getAdvert
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdvertResponse"
          description: Оголошення знайдено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      summary: Оголошення
      tags:
      - Board
  /api/v1/adverts/{advertId}/close:
    post:
      description: "Автор, у будь-який момент (FR-051). ACTIVE → CLOSED; нові відг\
        уки більше не приймаються, підтверджені учасники зберігають контакт."
      operationId: closeAdvert
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdvertResponse"
          description: Оголошення закрито
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Закрити оголошення
      tags:
      - Board
  /api/v1/adverts/{advertId}/rating:
    post:
      description: "FR-061: лише підтверджений учасник, лише після закриття оголош\
        ення (вручну, за дедлайном або після заповнення місць), один раз. У відпов\
        іді — оновлений рейтинг автора (FR-062)."
      operationId: rateAdvertAuthor
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RatingRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AuthorRatingResponse"
          description: Оцінку збережено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Оцінити автора оголошення
      tags:
      - Ratings
  /api/v1/adverts/{advertId}/replies:
    get:
      description: Лише автор (FR-047). Відкликані відгуки не показуються; найстаріші
        спершу.
      operationId: listAdvertReplies
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplyResponse"
          description: Відгуки
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      summary: Відгуки на моє оголошення
      tags:
      - Board
    post:
      description: "FR-046: лише на чуже (на своє — 403 OWN_ADVERT) відкрите оголо\
        шення, один відгук на оголошення. Відкликаний раніше відгук можна подати з\
        нову, відхилений — ні."
      operationId: replyToAdvert
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplyCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplyResponse"
          description: Відгук подано
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Відгукнутися на оголошення
      tags:
      - Board
  /api/v1/adverts/{advertId}/replies/{replyId}/confirm:
    post:
      description: "Автор (FR-048). Відгукувач починає бачити контакт (FR-049). Ко\
        ли підтверджених стає стільки, скільки місць, оголошення закривається (FR-050)."
      operationId: confirmAdvertReply
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      - description: Ідентифікатор відгуку (UUID)
        example: c1000000-0000-4000-8000-000000000001
        in: path
        name: replyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplyResponse"
          description: Відгук підтверджено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Підтвердити відгук
      tags:
      - Board
  /api/v1/adverts/{advertId}/replies/{replyId}/reject:
    post:
      description: Автор (FR-048).
      operationId: rejectAdvertReply
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      - description: Ідентифікатор відгуку (UUID)
        example: c1000000-0000-4000-8000-000000000001
        in: path
        name: replyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplyResponse"
          description: Відгук відхилено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Відхилити відгук
      tags:
      - Board
  /api/v1/adverts/{advertId}/replies/{replyId}/withdraw:
    post:
      description: "Автор відгуку, поки той у статусі PENDING (FR-053)."
      operationId: withdrawAdvertReply
      parameters:
      - description: Ідентифікатор оголошення (UUID)
        example: b1000000-0000-4000-8000-000000000001
        in: path
        name: advertId
        required: true
        schema:
          type: string
          format: uuid
      - description: Ідентифікатор відгуку (UUID)
        example: c1000000-0000-4000-8000-000000000001
        in: path
        name: replyId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ReplyResponse"
          description: Відгук відкликано
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Відкликати свій відгук
      tags:
      - Board
  /api/v1/auth/login:
    post:
      description: "Повертає JWT на 60 хв (FR-004, NFR-010). Неактивний акаунт — 403\
        \ ACCOUNT_NOT_VERIFIED."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Токен доступу
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Увійти
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "Пошта, роль Global Admin і організації, де користувач голова."
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Поточний користувач
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Поточний користувач
      tags:
      - Auth
    patch:
      description: "FR-069: інші користувачі бачать ім'я та прізвище замість ідент\
        ифікатора — в оголошеннях, відгуках, списку голів і журналі ролей."
      operationId: updateMe
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Оновлений користувач
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Змінити ім'я та прізвище
      tags:
      - Auth
  /api/v1/auth/password-reset:
    post:
      description: "FR-065: 6-значний код на пошту, дійсний 15 хв, 5 спроб. Не час\
        тіше ніж раз на хвилину. Для невідомої чи заблокованої пошти теж 204, щоб\
        \ не розкривати, які пошти зареєстровані."
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
        required: true
      responses:
        "204":
          description: "Якщо акаунт існує, код надіслано"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/MailUnavailable"
      summary: "Забули пароль: надіслати код"
      tags:
      - Auth
  /api/v1/auth/password-reset/confirm:
    post:
      description: "FR-065: код із листа + новий пароль. Після успіху входьте з но\
        вим паролем; непідтверджений акаунт заодно активується, бо код підтверджує\
        \ пошту."
      operationId: confirmPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetConfirmRequest"
        required: true
      responses:
        "204":
          description: Пароль змінено
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: "Забули пароль: задати новий"
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      description: "Лише пошта @ukma.edu.ua (FR-001). Створює неактивний акаунт і\
        \ надсилає 6-значний код (FR-002), дійсний 15 хв, 5 спроб (FR-003)."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: "Акаунт створено, код надіслано"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/MailUnavailable"
      summary: Зареєструватися
      tags:
      - Auth
  /api/v1/auth/resend-code:
    post:
      description: "Для непідтвердженого акаунта: новий код, старий стає недійсним\
        . Не частіше ніж раз на хвилину. Для невідомої пошти теж 204, щоб не розкр\
        ивати, які пошти зареєстровані."
      operationId: resendCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendCodeRequest"
        required: true
      responses:
        "204":
          description: "Якщо акаунт існує й не підтверджений, код надіслано"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/MailUnavailable"
      summary: Надіслати код ще раз
      tags:
      - Auth
  /api/v1/auth/verify:
    post:
      description: Після успіху можна входити. Неправильний код зменшує кількість
        спроб.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "204":
          description: Пошту підтверджено
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      summary: Підтвердити пошту кодом
      tags:
      - Auth
  /api/v1/complaints:
    post:
      description: "FR-056: скарга на оголошення або відгук із причиною (спам, обр\
        ази, інше). Одна скарга на один об'єкт від одного користувача; на власний\
        \ контент скаржитися не можна. Заблокований акаунт скарг не подає (FR-055)."
      operationId: createComplaint
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ComplaintResponse"
