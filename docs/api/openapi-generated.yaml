              message: Потрібна автентифікація
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Відсутній або недійсний JWT (UNAUTHORIZED)
    UnsupportedMediaType:
      content:
        application/json:
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              details:
              - field: file
                message: Невідомий формат файлу
                providedValue: logo.svg
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#unsupported-media-type
              message: "Підтримуються лише картинки JPEG, PNG і WebP"
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Файл не є картинкою JPEG, PNG чи WebP або запит не multipart/form-data\
        \ (UNSUPPORTED_MEDIA_TYPE)"
  schemas:
    ApiError:
      description: "Тіло помилки: код для програми, повідомлення для людини, детал\
        і по полях"
      properties:
        code:
          type: string
          description: Машиночитаний код помилки
          enum:
          - VALIDATION_ERROR
          - INVALID_PARAMETER
          - MALFORMED_REQUEST
          - INVALID_VERIFICATION_CODE
          - VERIFICATION_CODE_EXPIRED
          - UNAUTHORIZED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - ACCOUNT_NOT_VERIFIED
          - ACCOUNT_BLOCKED
          - ORGANIZATION_NOT_FOUND
          - EVENT_NOT_FOUND
          - USER_NOT_FOUND
          - HEAD_NOT_FOUND
          - ROUTE_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - SLUG_ALREADY_EXISTS
          - INVALID_STATE_TRANSITION
          - EMAIL_ALREADY_REGISTERED
          - ACCOUNT_ALREADY_VERIFIED
          - ALREADY_HEAD
          - LAST_HEAD
          - TOO_MANY_REQUESTS
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - STORAGE_UNAVAILABLE
          - MAIL_UNAVAILABLE
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        details:
          type: array
          description: "Порушення по конкретних полях/параметрах; порожній, якщо н\
            е застосовно"
          items:
            $ref: "#/components/schemas/FieldViolation"
        documentation:
          type: string
          description: Посилання на опис цього коду помилки
          example: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#validation-error
        message:
          type: string
          description: Зрозуміле людині повідомлення
          example: Запит містить невалідні поля
        requestId:
          type: string
          description: Кореляційний ідентифікатор запиту (дублюється в заголовку X-Request-Id
            і в логах)
          example: req_7f3a9c21d04b4e18
      required:
      - code
      - message
      - requestId
    AppointHeadRequest:
      type: object
      description: Призначити голову організації
      properties:
        email:
          type: string
          description: Пошта зареєстрованого користувача з підтвердженою поштою
          example: head@ukma.edu.ua
          minLength: 1
        replacesUserId:
          type: string
          format: uuid
          description: Якщо задано — цього голову буде знято в тій самій операції
            (лише Global Admin)
      required:
      - email
    ErrorResponse:
      description: Єдина обгортка для всіх помилок API
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
      - error
    EventCreateRequest:
      type: object
      description: "Подія, яку голова створює вручну; публікується одразу"
      properties:
        description:
          type: string
          description: Опис
          example: Жоско рубитимемося в бравл ШД
          maxLength: 5000
          minLength: 0
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, фідо серверна"
          maxLength: 200
          minLength: 0
        originalUrl:
          type: string
          description: Посилання на анонс
          example: https://www.instagram.com/p/C1a2b3d4/
          maxLength: 2048
          minLength: 0
          pattern: ^https?://\S+$
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601 зі зсувом)
          example: 2026-10-21T18:00:00+03:00
        title:
          type: string
          description: Назва
          example: Турнір з бравл старсу
          maxLength: 200
          minLength: 3
      required:
      - startsAt
      - title
    EventResponse:
      type: object
      description: Подія студентської організації
      properties:
        createdAt:
          type: string
          format: date-time
          description: Час створення (ISO 8601)
          example: 2026-10-14T10:00:00+03:00
        description:
          type: string
          description: Опис
          example: Граємо в кікер на гроші
        id:
          type: string
          format: uuid
          description: Ідентифікатор
          example: e1000000-0000-4000-8000-000000000001
        imageUrl:
          type: string
          description: "Посилання на картинку (постер) у сховищі; null, якщо не за\
            вантажено"
          example: https://project.supabase.co/storage/v1/object/public/images/organizations/3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60/events/e1000000-0000-4000-8000-000000000001/image-4d5e6f.jpg
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, лаба"
        organizationId:
          type: string
          format: uuid
          description: Організація-власник
          example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        originalUrl:
          type: string
          description: Посилання на оригінальний пост або анонс
          example: https://www.instagram.com/p/C1a2b3d4/
        scraped:
          type: boolean
          description: Чи створена подія скрейпером
          example: false
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601)
          example: 2026-10-21T18:00:00+03:00
        status:
          type: string
          description: Статус модерації
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
          - UNPUBLISHED
          example: PUBLISHED
        title:
          type: string
          description: Назва
          example: Граємо в кікер
        updatedAt:
          type: string
          format: date-time
          description: Час останньої зміни (ISO 8601)
          example: 2026-10-14T10:00:00+03:00
        verified:
          type: boolean
          description: "false — автоопублікована подія, яку голова ще не перегляну\
            в (FR-032)"
          example: true
      required:
      - createdAt
      - id
      - organizationId
      - scraped
      - startsAt
      - status
      - title
      - updatedAt
      - verified
    EventUpdateRequest:
      type: object
      description: "Часткове оновлення події: передавайте лише поля, які змінюютьс\
        я"
      properties:
        description:
          type: string
          description: Опис
          maxLength: 5000
          minLength: 0
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, підвол"
          maxLength: 200
          minLength: 0
        originalUrl:
          type: string
          description: Посилання на анонс
          example: https://www.instagram.com/p/C1a2b3d4/
          maxLength: 2048
          minLength: 0
          pattern: ^https?://\S+$
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601 зі зсувом)
          example: 2026-10-21T19:00:00+03:00
        title:
          type: string
          description: Назва
          example: аукціон побачень
          maxLength: 200
          minLength: 3
          pattern: (?s).*\S.*
    FieldViolation:
      description: Порушення правила валідації для одного поля або параметра
      properties:
        field:
          type: string
          description: Назва поля тіла запиту або query/path-параметра
          example: slug
        message:
          type: string
          description: Що саме не так
          example: "Slug: 3–50 символів, лише a-z, 0-9 і дефіс"
        providedValue:
          type: object
          description: Передане значення (може бути відсутнє)
          example: Debate Club!
    GoogleCalendarLink:
      type: object
      description: Посилання для відкриття події в Google Calendar (FR-041)
      properties:
        url:
          type: string
          format: uri
          description: Посилання на шаблон події
          example: https://calendar.google.com/calendar/render?action=TEMPLATE&text=...
      required:
      - url
    LoginRequest:
      type: object
      description: Вхід за поштою й паролем
      properties:
        email:
          type: string
          example: student@ukma.edu.ua
          minLength: 1
        password:
          type: string
          example: correct-horse-battery
          minLength: 1
      required:
      - email
      - password
    OffsetPageEventResponse:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        pagination:
          $ref: "#/components/schemas/OffsetPagination"
    OffsetPageOrganization:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Organization"
        pagination:
          $ref: "#/components/schemas/OffsetPagination"
    OffsetPagination:
      type: object
      description: Метадані пагінації зі зсувом
      properties:
        hasMore:
          type: boolean
          description: Чи є ще елементи після цієї сторінки
          example: true
        limit:
          type: integer
          format: int32
          example: 20
        offset:
          type: integer
          format: int32
          example: 0
        total:
          type: integer
          format: int64
          description: "Загальна кількість елементів, що відповідають фільтрам"
          example: 42
    Organization:
      type: object
      description: Студентська організація
      properties:
        autoPublish:
          type: boolean
          description: Публікувати спаршені події без модерації (FR-029); за замовчуванням
            вимкнено
          example: false
        contactEmail:
          type: string
          description: Контактна пошта організації
          example: debate@ukma.edu.ua
        createdAt:
          type: string
          format: date-time
          description: Час створення (ISO 8601)
          example: 2026-09-01T10:00:00+03:00
        description:
          type: string
          description: Опис діяльності
          example: Щотижневі тренування з британського парламентського формату
        id:
          type: string
          format: uuid
          description: Ідентифікатор
          example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        instagramHandle:
          type: string
          description: "Instagram-акаунт без @, з якого скрейпер збирає події"
          example: ukma.debate
        logoUrl:
          type: string
          description: "Посилання на логотип у сховищі; null, якщо логотип не зава\
            нтажено"
          example: https://project.supabase.co/storage/v1/object/public/images/organizations/3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60/logo-1a2b3c.png
        name:
          type: string
          description: Назва
          example: Дебатний клуб НаУКМА
        slug:
          type: string
          description: Унікальний людиночитаний ідентифікатор для URL
          example: debate-club
        updatedAt:
          type: string
          format: date-time
          description: Час останньої зміни (ISO 8601)
          example: 2026-09-15T12:30:00+03:00
      required:
      - autoPublish
      - createdAt
      - id
      - name
      - slug
      - updatedAt
    OrganizationCreateRequest:
      type: object
      description: Дані для створення організації (лише суперадмін)
      properties:
        contactEmail:
          type: string
          format: email
          description: Контактна пошта
          example: fido@ukma.edu.ua
        description:
          type: string
          description: Опис діяльності
          example: "Студентська IT-спільнота: хакатони та лекції"
          maxLength: 2000
          minLength: 0
        headEmail:
          type: string
          description: "Пошта першого голови: зареєстрований користувач з підтверд\
            женою поштою. Організація без голови не створюється (FR-011, FR-014)"
          example: head@ukma.edu.ua
          minLength: 1
        instagramHandle:
          type: string
          description: Instagram-акаунт без @
          example: fido_naukma
          pattern: "^[A-Za-z0-9._]{1,30}$"
        name:
          type: string
          description: Назва
          example: FIDo
          maxLength: 100
          minLength: 3
        slug:
          type: string
          description: "Унікальний slug: a-z, 0-9, дефіс між словами"
          example: fido
          maxLength: 50
          minLength: 3
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
      required:
      - headEmail
      - name
      - slug
    OrganizationHead:
      type: object
      description: Голова організації
      properties:
        appointedAt:
          type: string
          format: date-time
          description: Коли призначено (ISO 8601)
        appointedBy:
          type: string
          format: uuid
          description: "Хто призначив; null, якщо цього користувача вже видалено"
        email:
          type: string
          description: Пошта
          example: head@ukma.edu.ua
        userId:
          type: string
          format: uuid
          description: Ідентифікатор користувача
      required:
      - appointedAt
      - email
      - userId
    OrganizationUpdateRequest:
      type: object
      description: "Часткове оновлення організації: передавайте лише поля, які змі\
        нюються; відсутнє або null поле не змінюється"
      properties:
        autoPublish:
          type: boolean
          description: Увімкнути або вимкнути автопублікацію спаршених подій (FR-029)
          example: true
        contactEmail:
          type: string
          format: email
          description: Контактна пошта
          example: debate@ukma.edu.ua
        description:
          type: string
          description: Опис діяльності
          maxLength: 2000
          minLength: 0
        instagramHandle:
          type: string
          description: Instagram-акаунт без @
          example: ukma.debate
          pattern: "^[A-Za-z0-9._]{1,30}$"
        name:
          type: string
          description: Назва
          example: Debate Club NaUKMA
          maxLength: 100
          minLength: 3
        slug:
          type: string
          description: Унікальний slug
          example: debate-club
          maxLength: 50
          minLength: 3
          pattern: "^[a-z0-9]+(-[a-z0-9]+)*$"
    RegisterRequest:
      type: object
      description: Реєстрація з університетською поштою
      properties:
        email:
          type: string
          format: email
          example: student@ukma.edu.ua
          maxLength: 320
          minLength: 0
        password:
          type: string
          example: correct-horse-battery
          maxLength: 72
          minLength: 8
      required:
      - email
      - password
    ResendCodeRequest:
      type: object
      description: Запит нового коду підтвердження
      properties:
        email:
          type: string
          example: student@ukma.edu.ua
          minLength: 1
      required:
      - email
    RoleChange:
      type: object
      description: "Зміна ролі голови: хто, кому, що, коли (FR-013)"
      properties:
        action:
          type: string
          enum:
          - APPOINTED
          - REMOVED
        actorEmail:
          type: string
          example: admin@ukma.edu.ua
        actorUserId:
          type: string
          format: uuid
          description: "Хто змінив; null, якщо цього користувача вже видалено"
        createdAt:
          type: string
          format: date-time
          description: Коли (ISO 8601)
        id:
          type: string
          format: uuid
        organizationId:
          type: string
          format: uuid
        targetEmail:
          type: string
          example: head@ukma.edu.ua
        targetUserId:
          type: string
          format: uuid
          description: Кому змінили роль
      required:
      - action
      - createdAt
      - id
      - organizationId
      - targetEmail
      - targetUserId
    TokenResponse:
      type: object
      description: "JWT для заголовка Authorization: Bearer <accessToken>"
      properties:
        accessToken:
          type: string
        expiresIn:
          type: integer
          format: int64
          description: Через скільки секунд токен стане недійсним
          example: 3600
        tokenType:
          type: string
          example: Bearer
      required:
      - accessToken
      - expiresIn
      - tokenType
    UserResponse:
      type: object
      description: Користувач
      properties:
        email:
          type: string
          example: student@ukma.edu.ua
        globalAdmin:
          type: boolean
          description: Чи має роль Global Admin
        headOf:
          type: array
          description: "Організації, де користувач голова"
          items:
            type: string
            format: uuid
        id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - PENDING
          - ACTIVE
          - BLOCKED
          example: ACTIVE
      required:
      - email
      - globalAdmin
      - headOf
      - id
      - status
    VerifyRequest:
      type: object
      description: Підтвердження пошти кодом з листа
      properties:
        code:
          type: string
          example: "042517"
          minLength: 1
          pattern: "\\s*\\d{6}\\s*"
        email:
          type: string
          example: student@ukma.edu.ua
          minLength: 1
      required:
      - code
      - email
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: "JWT з POST /api/v1/auth/login, діє 60 хв"
      scheme: bearer
      type: http
