openapi: 3.1.0
info:
  contact:
    name: Команда Student Community
  description: "API мікросервісу «Студентське ком'юніті та Івенти» (екосистема SmartUKMA):\
    \ каталог студентських організацій. Специфікація згенерована з коду (Code-First).\
    \ Відповіді — заглушки з пам'яті процесу."
  title: Student Community & Events API
  version: 1.0.0
servers:
- description: Generated server url
  url: http://localhost:8080
tags:
- description: "Реєстрація з поштою @ukma.edu.ua, вхід, поточний користувач"
  name: Auth
- description: Каталог студентських організацій
  name: Organizations
- description: Голови організацій і журнал змін ролей
  name: Heads
paths:
  /api/v1/auth/login:
    post:
      description: "Повертає JWT на 60 хв (FR-004, NFR-010). Неактивний акаунт — 403\
        \ ACCOUNT_NOT_VERIFIED."
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/TokenResponse"
          description: Токен доступу
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      summary: Увійти
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      description: "Пошта, роль Global Admin і організації, де користувач голова."
      operationId: me
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: Поточний користувач
        "401":
          $ref: "#/components/responses/Unauthorized"
      security:
      - bearerAuth: []
      summary: Поточний користувач
      tags:
      - Auth
  /api/v1/auth/register:
    post:
      description: "Лише пошта @ukma.edu.ua (FR-001). Створює неактивний акаунт і\
        \ надсилає 6-значний код (FR-002), дійсний 15 хв, 5 спроб (FR-003)."
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
          description: "Акаунт створено, код надіслано"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/MailUnavailable"
      summary: Зареєструватися
      tags:
      - Auth
  /api/v1/auth/resend-code:
    post:
      description: "Для непідтвердженого акаунта: новий код, старий стає недійсним\
        . Не частіше ніж раз на хвилину. Для невідомої пошти теж 204, щоб не розкр\
        ивати, які пошти зареєстровані."
      operationId: resendCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendCodeRequest"
        required: true
      responses:
        "204":
          description: "Якщо акаунт існує й не підтверджений, код надіслано"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/MailUnavailable"
      summary: Надіслати код ще раз
      tags:
      - Auth
  /api/v1/auth/verify:
    post:
      description: Після успіху можна входити. Неправильний код зменшує кількість
        спроб.
      operationId: verifyEmail
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
        required: true
      responses:
        "204":
          description: Пошту підтверджено
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      summary: Підтвердити пошту кодом
      tags:
      - Auth
  /api/v1/events:
    get:
      description: "Публічна (доступна гостям). Лише опубліковані майбутні події,\
        \ відсортовані за часом початку (FR-038). Фільтри за організацією й діапаз\
        оном дат (FR-039). Знак «+» у зсуві часового поясу в query потрібно кодува\
        ти як %2B або використовувати «Z»."
      operationId: listEvents
      parameters:
      - description: Лише події цієї організації
        example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        in: query
        name: organizationId
        required: false
        schema:
          type: string
          format: uuid
      - description: Початок не раніше (ISO 8601)
        example: 2026-10-20T00:00:00Z
        in: query
        name: from
        required: false
        schema:
          type: string
          format: date-time
      - description: Початок раніше за (ISO 8601)
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageEventResponse"
          description: Сторінка подій
        "400":
          $ref: "#/components/responses/BadRequest"
      summary: Дайджест подій
      tags:
      - Events
  /api/v1/events/{eventId}:
    get:
      description: Публічна (FR-040). Неопубліковані події повертають 404.
      operationId: getEvent
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Подію знайдено
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Деталі події
      tags:
      - Events
    patch:
      description: "Голова організації-власника. Можна редагувати до і після публі\
        кації (FR-034), крім відхилених подій."
      operationId: updateEvent
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventUpdateRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Оновлену подію повернуто
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Частково оновити подію
      tags:
      - Events
  /api/v1/events/{eventId}/approve:
    post:
      description: Голова організації. PENDING або UNPUBLISHED → PUBLISHED (FR-035);
        для неперевіреної автоопублікованої події позначає її переглянутою (FR-032).
      operationId: approveEvent
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Подію опубліковано
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Схвалити подію
      tags:
      - Events
  /api/v1/events/{eventId}/calendar.ics:
    get:
      description: "Публічна (FR-042). Час у файлі в UTC, календар користувача пок\
        аже його в місцевому поясі."
      operationId: downloadEventIcs
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            text/calendar:
              schema:
                type: string
          description: Файл календаря
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Файл .ics для події
      tags:
      - Calendar
  /api/v1/events/{eventId}/calendar/google:
    get:
      description: "Публічна (FR-041). Повертає посилання на шаблон події з назвою\
        , часом, місцем і описом."
      operationId: getGoogleCalendarLink
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GoogleCalendarLink"
          description: Посилання сформовано
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Посилання на Google Calendar
      tags:
      - Calendar
  /api/v1/events/{eventId}/image:
    delete:
      description: "Голова організації-власника. Якщо картинки немає, нічого не зм\
        інюється."
      operationId: deleteEventImage
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Картинки більше немає
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Прибрати картинку події
      tags:
      - Events
    put:
      description: "Голова організації-власника. JPEG, PNG або WebP до 5 МБ, поле\
        \ форми `file`. Відхилену подію змінити не можна (409). Попередня картинка\
        \ видаляється зі сховища."
      operationId: uploadEventImage
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Файл картинки
              required:
              - file
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Подію з новим imageUrl повернуто
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "503":
          $ref: "#/components/responses/StorageUnavailable"
      security:
      - bearerAuth: []
      summary: Завантажити або замінити картинку події
      tags:
      - Events
  /api/v1/events/{eventId}/reject:
    post:
      description: "Голова організації. Лише з черги модерації: PENDING → REJECTED\
        \ (FR-035)."
      operationId: rejectEvent
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Подію відхилено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Відхилити подію
      tags:
      - Events
  /api/v1/events/{eventId}/unpublish:
    post:
      description: Голова організації. PUBLISHED → UNPUBLISHED (FR-036).
      operationId: unpublishEvent
      parameters:
      - description: Ідентифікатор події (UUID)
        example: e1000000-0000-4000-8000-000000000001
        in: path
        name: eventId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/EventResponse"
          description: Подію знято з публікації
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Зняти подію з публікації
      tags:
      - Events
  /api/v1/organizations:
    get:
      description: "Публічна (доступна гостям). Пагінація зі зсувом, сортування за\
        \ назвою."
      operationId: listOrganizations
      parameters:
      - description: "Пошук за назвою або slug, без урахування регістру"
        example: клуб
        in: query
        name: q
        required: false
        schema:
          type: string
          maxLength: 100
          minLength: 0
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageOrganization"
          description: Сторінка організацій
        "400":
          $ref: "#/components/responses/BadRequest"
      summary: Список організацій
      tags:
      - Organizations
    post:
      description: "Лише Global Admin. Slug має бути унікальним. Перший голова (headEmail)\
        \ призначається одразу: організація без голови не створюється."
      operationId: createOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationCreateRequest"
        required: true
      responses:
        "201":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Organization"
          description: Організацію створено
          headers:
            Location:
              description: URL нової організації
              schema:
                type: string
                format: uri
              style: simple
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Створити організацію
      tags:
      - Organizations
  /api/v1/organizations/{organizationId}:
    delete:
      description: "Лише Global Admin. Разом з організацією видаляються її події,\
        \ голови й файли."
      operationId: deleteOrganization
      parameters:
      - description: Ідентифікатор організації (UUID)
        example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Організацію видалено
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
      security:
      - bearerAuth: []
      summary: Видалити організацію
      tags:
      - Organizations
    get:
      description: Публічна (доступна гостям).
      operationId: getOrganization
      parameters:
      - description: Ідентифікатор організації (UUID)
        example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Organization"
          description: Організацію знайдено
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
      summary: Організація за ідентифікатором
      tags:
      - Organizations
    patch:
      description: Суперадмін або голова цієї організації. Змінюються лише передані
        поля.
      operationId: updateOrganization
      parameters:
      - description: Ідентифікатор організації (UUID)
        example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdateRequest"
        required: true
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/Organization"
          description: Оновлену організацію повернуто
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
      security:
      - bearerAuth: []
      summary: Частково оновити організацію
      tags:
      - Organizations
  /api/v1/organizations/{organizationId}/events:
    get:
      description: "Голова організації. Усі статуси; status=PENDING — черга модера\
        ції (FR-033), verified=false — автоопубліковані, ще не переглянуті (FR-032)."
      operationId: listOrganizationEvents
      parameters:
      - description: Ідентифікатор організації (UUID)
        example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        in: path
        name: organizationId
        required: true
        schema:
          type: string
          format: uuid
      - description: Фільтр за статусом
        example: PENDING
        in: query
        name: status
        required: false
        schema:
          type: string
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
          - UNPUBLISHED
      - description: Фільтр за ознакою перевірки головою
        example: false
        in: query
        name: verified
        required: false
        schema:
          type: boolean
      - description: "Розмір сторінки, 1–100"
        in: query
        name: limit
        required: false
        schema:
          type: string
          maximum: 100
          minimum: 1
      - description: Скільки елементів пропустити
        in: query
        name: offset
        required: false
        schema:
          type: string
          minimum: 0
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/OffsetPageEventResponse"
          description: Сторінка подій організації
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
