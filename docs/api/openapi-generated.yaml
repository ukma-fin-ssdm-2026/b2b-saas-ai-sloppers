        schema:
          type: string
          format: date-time
      - description: Початок раніше за (ISO 8601)
        example: 2026-11-01T00:00:00Z
        in: query
        name: to
        required: false
        schema:
          type: string
          format: date-time
      - description: "Розмір сторінки, 1–100"
        in: query
