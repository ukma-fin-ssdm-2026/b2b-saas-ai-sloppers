              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#too-many-requests
              message: Новий код можна запросити через 42 с
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Забагато запитів, спробуйте пізніше (TOO_MANY_REQUESTS)"
    Unauthorized:
      content:
        application/json:
          example:
            error:
              code: UNAUTHORIZED
              details: []
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#unauthorized
              message: Потрібна автентифікація
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Відсутній або недійсний JWT (UNAUTHORIZED)
    UnsupportedMediaType:
      content:
        application/json:
          example:
            error:
              code: UNSUPPORTED_MEDIA_TYPE
              details:
              - field: file
                message: Невідомий формат файлу
                providedValue: logo.svg
              documentation: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#unsupported-media-type
              message: "Підтримуються лише картинки JPEG, PNG і WebP"
              requestId: req_7f3a9c21d04b4e18
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: "Файл не є картинкою JPEG, PNG чи WebP або запит не multipart/form-data\
        \ (UNSUPPORTED_MEDIA_TYPE)"
  schemas:
    AdvertCreateRequest:
      type: object
      description: "Нове оголошення на дошці (FR-043, FR-044)"
      properties:
        contact:
          type: string
          description: "Як з вами зв'язатися: Telegram, телефон або email. Бачать\
            \ лише ви й ті, чий відгук ви підтвердили (FR-049)"
          example: '@hackathon_seeker'
          maxLength: 200
          minLength: 0
          pattern: "^(@[A-Za-z0-9_]{5,32}|(https://)?t\\.me/[A-Za-z0-9_]{5,32}|\\\
            +?[0-9][0-9 ()-]{5,18}[0-9]|[^@\\s]+@[^@\\s]+\\.[^@\\s]+)$"
        deadline:
          type: string
          format: date-time
          description: До коли збираєте людей (ISO 8601 зі зсувом); після нього оголошення
            закриється
          example: 2026-11-20T18:00:00+02:00
        description:
          type: string
          description: Опис
          example: "Команда з трьох людей, бракує Java/Spring. Хакатон 22–23 листо\
            пада."
          maxLength: 2000
          minLength: 0
        slots:
          type: integer
          format: int32
          description: "Скільки людей шукаєте, 1–50"
          example: 2
          maximum: 50
          minimum: 1
        title:
          type: string
          description: Заголовок
          example: Шукаю бекендера на хакатон
          maxLength: 200
          minLength: 3
        type:
          type: string
          description: "TEAM — пошук команди, LEISURE — компанія для дозвілля"
          enum:
          - TEAM
          - LEISURE
          example: TEAM
      required:
      - contact
      - deadline
      - description
      - slots
      - title
      - type
    AdvertResponse:
      type: object
      description: Оголошення на дошці
      properties:
        authorName:
          type: string
          description: "Ім'я та прізвище автора; null, якщо автор їх не задав (FR-069)"
          example: Теодора Гречко
        authorRating:
          $ref: "#/components/schemas/RatingSummary"
          description: Рейтинг автора за оцінками учасників його закритих оголошень
            (FR-062)
        contact:
          type: string
          description: "Контакт автора. null для всіх, крім автора й підтверджених\
            \ відгукувачів (FR-049)"
          example: '@hackathon_seeker'
        createdAt:
          type: string
          format: date-time
          description: Час створення (ISO 8601)
          example: 2026-11-16T12:00:00+02:00
        deadline:
          type: string
          format: date-time
          description: Дедлайн (ISO 8601)
          example: 2026-11-20T18:00:00+02:00
        description:
          type: string
          description: Опис
          example: "Команда з трьох людей, бракує Java/Spring."
        id:
          type: string
          format: uuid
          description: Ідентифікатор
          example: b1000000-0000-4000-8000-000000000001
        myRating:
          type: integer
          format: int32
          description: "Ваша оцінка автора за це оголошення; null, якщо ви ще не о\
            цінювали (FR-061)"
          example: 5
        myReplyStatus:
          type: string
          description: "Статус вашого відгуку на це оголошення; null, якщо ви не в\
            ідгукувалися"
          enum:
          - PENDING
          - CONFIRMED
          - REJECTED
          - WITHDRAWN
          - REMOVED
          example: PENDING
        own:
          type: boolean
          description: Чи ви автор оголошення
          example: false
        slots:
          type: integer
          format: int32
          description: Кількість місць
          example: 2
        status:
          type: string
          description: "ACTIVE або CLOSED; оголошення з дедлайном, що минув, — CLOSED"
          enum:
          - ACTIVE
          - CLOSED
          - DELETED
          example: ACTIVE
        title:
          type: string
          description: Заголовок
          example: Шукаю бекендера на хакатон
        type:
          type: string
          description: Тип
          enum:
          - TEAM
          - LEISURE
          example: TEAM
      required:
      - authorRating
      - createdAt
      - deadline
      - description
      - id
      - own
      - slots
      - status
      - title
      - type
    ApiError:
      description: "Тіло помилки: код для програми, повідомлення для людини, детал\
        і по полях"
      properties:
        code:
          type: string
          description: Машиночитаний код помилки
          enum:
          - VALIDATION_ERROR
          - INVALID_PARAMETER
          - MALFORMED_REQUEST
          - CONTENT_REJECTED
          - INVALID_VERIFICATION_CODE
          - VERIFICATION_CODE_EXPIRED
          - UNAUTHORIZED
          - INVALID_CREDENTIALS
          - FORBIDDEN
          - ACCOUNT_NOT_VERIFIED
          - ACCOUNT_BLOCKED
          - OWN_ADVERT
          - ORGANIZATION_NOT_FOUND
          - EVENT_NOT_FOUND
          - ADVERT_NOT_FOUND
          - REPLY_NOT_FOUND
          - USER_NOT_FOUND
          - HEAD_NOT_FOUND
          - COMPLAINT_NOT_FOUND
          - BANNED_WORD_NOT_FOUND
          - ROUTE_NOT_FOUND
          - METHOD_NOT_ALLOWED
          - SLUG_ALREADY_EXISTS
          - INVALID_STATE_TRANSITION
          - EMAIL_ALREADY_REGISTERED
          - ACCOUNT_ALREADY_VERIFIED
          - ALREADY_HEAD
          - LAST_HEAD
          - ALREADY_REPLIED
          - ADVERT_CLOSED
          - ALREADY_COMPLAINED
          - ALREADY_BANNED
          - NOT_BANNED
          - BANNED_WORD_EXISTS
          - ALREADY_RATED
          - ADVERT_NOT_CLOSED
          - TOO_MANY_REQUESTS
          - PAYLOAD_TOO_LARGE
          - UNSUPPORTED_MEDIA_TYPE
          - STORAGE_UNAVAILABLE
          - MAIL_UNAVAILABLE
          - INTERNAL_ERROR
          example: VALIDATION_ERROR
        details:
          type: array
          description: "Порушення по конкретних полях/параметрах; порожній, якщо н\
            е застосовно"
          items:
            $ref: "#/components/schemas/FieldViolation"
        documentation:
          type: string
          description: Посилання на опис цього коду помилки
          example: https://ukma-fin-ssdm-2026.github.io/YOUR-REPO/api/errors#validation-error
        message:
          type: string
          description: Зрозуміле людині повідомлення
          example: Запит містить невалідні поля
        requestId:
          type: string
          description: Кореляційний ідентифікатор запиту (дублюється в заголовку X-Request-Id
            і в логах)
          example: req_7f3a9c21d04b4e18
      required:
      - code
      - message
      - requestId
    AppointHeadRequest:
      type: object
      description: Призначити голову організації
      properties:
        email:
          type: string
          description: Пошта зареєстрованого користувача з підтвердженою поштою
          example: head@ukma.edu.ua
          minLength: 1
        replacesUserId:
          type: string
          format: uuid
          description: Якщо задано — цього голову буде знято в тій самій операції
            (лише Global Admin)
      required:
      - email
    AuthorRatingResponse:
      type: object
      description: Оцінка автора оголошення
      properties:
        advertId:
          type: string
          format: uuid
        authorId:
          type: string
          format: uuid
        authorRating:
          $ref: "#/components/schemas/RatingSummary"
          description: Рейтинг автора з урахуванням цієї оцінки
        createdAt:
          type: string
          format: date-time
        score:
          type: integer
          format: int32
          description: Ваша оцінка
          example: 5
      required:
      - advertId
      - authorId
      - authorRating
      - createdAt
      - score
    BanRequest:
      type: object
      description: Блокування користувача
      properties:
        expiresAt:
          type: string
          format: date-time
          description: Коли блокування спадає саме; порожнє — безстроково
          example: 2026-12-31T23:59:00+02:00
        reason:
          type: string
          description: "Причина, яку побачить журнал модерації"
          example: Спам на дошці оголошень
          maxLength: 500
          minLength: 0
      required:
      - reason
    BanResponse:
      type: object
      description: Блокування
      properties:
        active:
          type: boolean
          description: Чи діє блокування зараз
        automatic:
          type: boolean
          description: Чи заблокувала система автоматично
        bannedBy:
          type: string
          format: uuid
          description: Хто заблокував; порожнє — автоматичне блокування (FR-060)
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: Коли спадає; порожнє — безстроково
        id:
          type: string
          format: uuid
        liftedAt:
          type: string
          format: date-time
        liftedBy:
          type: string
          format: uuid
          description: Хто зняв; порожнє — строк вийшов
        reason:
          type: string
        userId:
          type: string
          format: uuid
    BannedWordRequest:
      type: object
      description: Заборонене слово
      properties:
        word:
          type: string
          description: Одне слово; регістр не має значення
          example: спам
          maxLength: 100
          minLength: 2
      required:
      - word
    BannedWordResponse:
      type: object
      description: Заборонене слово
      properties:
        addedBy:
          type: string
          format: uuid
          description: Хто додав
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        word:
          type: string
    ComplaintCreateRequest:
      type: object
      description: Скарга на контент
      properties:
        category:
          type: string
          description: Причина
          enum:
          - SPAM
          - ABUSE
          - OTHER
          example: SPAM
        comment:
          type: string
          description: "Деталі, якщо потрібні"
          example: "Рекламує курси, не має стосунку до НаУКМА"
          maxLength: 500
          minLength: 0
        targetId:
          type: string
          format: uuid
          description: Ідентифікатор оголошення або відгуку
          example: b1000000-0000-4000-8000-000000000001
        targetType:
          type: string
          description: На що скарга
          enum:
          - ADVERT
          - REPLY
          example: ADVERT
      required:
      - category
      - targetId
      - targetType
    ComplaintDecisionRequest:
      type: object
      description: Рішення щодо скарги
      properties:
        resolution:
          type: string
          description: Коментар модератора для журналу
          example: "Реклама, оголошення прибрано"
          maxLength: 500
          minLength: 0
    ComplaintResponse:
      type: object
      description: Скарга
      properties:
        authorId:
          type: string
          format: uuid
          description: Автор оскарженого контенту
        authorName:
          type: string
          description: "Ім'я автора контенту, якщо задане"
        category:
          type: string
          enum:
          - SPAM
          - ABUSE
          - OTHER
        comment:
          type: string
        createdAt:
          type: string
          format: date-time
        id:
          type: string
          format: uuid
        reporterId:
          type: string
          format: uuid
          description: Хто поскаржився
        resolution:
          type: string
        resolvedAt:
          type: string
          format: date-time
        resolvedBy:
          type: string
          format: uuid
          description: Хто розглянув
        status:
          type: string
          enum:
          - OPEN
          - RESOLVED
          - DISMISSED
        targetId:
          type: string
          format: uuid
        targetType:
          type: string
          enum:
          - ADVERT
          - REPLY
    ErrorResponse:
      description: Єдина обгортка для всіх помилок API
      properties:
        error:
          $ref: "#/components/schemas/ApiError"
      required:
      - error
    EventCreateRequest:
      type: object
      description: "Подія, яку голова створює вручну; публікується одразу"
      properties:
        description:
          type: string
          description: Опис
          example: Жоско рубитимемося в бравл ШД
          maxLength: 5000
          minLength: 0
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, фідо серверна"
          maxLength: 200
          minLength: 0
        originalUrl:
          type: string
          description: Посилання на анонс
          example: https://www.instagram.com/p/C1a2b3d4/
          maxLength: 2048
          minLength: 0
          pattern: ^https?://\S+$
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601 зі зсувом)
          example: 2026-10-21T18:00:00+03:00
        title:
          type: string
          description: Назва
          example: Турнір з бравл старсу
          maxLength: 200
          minLength: 3
      required:
      - startsAt
      - title
    EventResponse:
      type: object
      description: Подія студентської організації
      properties:
        createdAt:
          type: string
          format: date-time
          description: Час створення (ISO 8601)
          example: 2026-10-14T10:00:00+03:00
        description:
          type: string
          description: Опис
          example: Граємо в кікер на гроші
        id:
          type: string
          format: uuid
          description: Ідентифікатор
          example: e1000000-0000-4000-8000-000000000001
        imageUrl:
          type: string
          description: "Посилання на картинку (постер) у сховищі; null, якщо не за\
            вантажено"
          example: https://project.supabase.co/storage/v1/object/public/images/organizations/3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60/events/e1000000-0000-4000-8000-000000000001/image-4d5e6f.jpg
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, лаба"
        organizationId:
          type: string
          format: uuid
          description: Організація-власник
          example: 3f6c1f0e-8a2b-4c1d-9e7a-1b2c3d4e5f60
        originalUrl:
          type: string
          description: Посилання на оригінальний пост або анонс
          example: https://www.instagram.com/p/C1a2b3d4/
        scraped:
          type: boolean
          description: Чи створена подія скрейпером
          example: false
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601)
          example: 2026-10-21T18:00:00+03:00
        status:
          type: string
          description: Статус модерації
          enum:
          - PENDING
          - PUBLISHED
          - REJECTED
          - UNPUBLISHED
          example: PUBLISHED
        title:
          type: string
          description: Назва
          example: Граємо в кікер
        updatedAt:
          type: string
          format: date-time
          description: Час останньої зміни (ISO 8601)
          example: 2026-10-14T10:00:00+03:00
        verified:
          type: boolean
          description: "false — автоопублікована подія, яку голова ще не перегляну\
            в (FR-032)"
          example: true
      required:
      - createdAt
      - id
      - organizationId
      - scraped
      - startsAt
      - status
      - title
      - updatedAt
      - verified
    EventUpdateRequest:
      type: object
      description: "Часткове оновлення події: передавайте лише поля, які змінюютьс\
        я"
      properties:
        description:
          type: string
          description: Опис
          maxLength: 5000
          minLength: 0
        location:
          type: string
          description: Місце проведення
          example: "НаУКМА, підвол"
          maxLength: 200
          minLength: 0
        originalUrl:
          type: string
          description: Посилання на анонс
          example: https://www.instagram.com/p/C1a2b3d4/
          maxLength: 2048
          minLength: 0
          pattern: ^https?://\S+$
        startsAt:
          type: string
          format: date-time
          description: Дата й час початку (ISO 8601 зі зсувом)
          example: 2026-10-21T19:00:00+03:00
        title:
          type: string
          description: Назва
          example: аукціон побачень
          maxLength: 200
          minLength: 3
          pattern: (?s).*\S.*
    FieldViolation:
      description: Порушення правила валідації для одного поля або параметра
      properties:
        field:
          type: string
          description: Назва поля тіла запиту або query/path-параметра
          example: slug
        message:
          type: string
          description: Що саме не так
          example: "Slug: 3–50 символів, лише a-z, 0-9 і дефіс"
        providedValue:
          type: object
          description: Передане значення (може бути відсутнє; для пароля й коду підтвердження
            не повертається)
          example: Debate Club!
    GoogleCalendarLink:
      type: object
      description: Посилання для відкриття події в Google Calendar (FR-041)
      properties:
        url:
          type: string
          format: uri
          description: Посилання на шаблон події
          example: https://calendar.google.com/calendar/render?action=TEMPLATE&text=...
      required:
      - url
    LoginRequest:
      type: object
      description: Вхід за поштою й паролем
      properties:
        email:
          type: string
          example: student@ukma.edu.ua
          minLength: 1
        password:
          type: string
          example: correct-horse-battery
          minLength: 1
      required:
      - email
      - password
    OffsetPageAdvertResponse:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/AdvertResponse"
        pagination:
          $ref: "#/components/schemas/OffsetPagination"
    OffsetPageComplaintResponse:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ComplaintResponse"
        pagination:
          $ref: "#/components/schemas/OffsetPagination"
    OffsetPageEventResponse:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/EventResponse"
        pagination:
          $ref: "#/components/schemas/OffsetPagination"
    OffsetPageOrganizationResponse:
      type: object
      description: "Сторінка результатів, пагінація зі зсувом (offset)"
      properties:
        data:
          type: array
