name: Lint

# Report-only for now: findings are shown in the run summary but never fail the build.
# To make it blocking:
#   backend  - remove failOnViolation / failOnError=false from pom.xml (after the style cleanup)
#   frontend - remove continue-on-error from the check steps below

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint Backend
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Checkstyle (validate) + SpotBugs with find-sec-bugs (verify), as bound in pom.xml; tests run in ci.yml
      - name: Run Checkstyle and SpotBugs
        run: ./mvnw -B -ntp verify -DskipTests

      - name: Summary
        if: always()
        run: |
          count() {
            if [ -f "$2" ]; then { grep -o "$1" "$2" || true; } | wc -l | tr -d ' '; else echo "n/a"; fi
          }
          {
            echo "### Backend static analysis"
            echo "| Check | Findings |"
            echo "| --- | --- |"
            echo "| Checkstyle | $(count '<error ' target/checkstyle-result.xml) |"
            echo "| SpotBugs (all) | $(count '<BugInstance ' target/spotbugsXml.xml) |"
            echo "| SpotBugs (SECURITY) | $(count "<BugInstance [^>]*category='SECURITY'" target/spotbugsXml.xml) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-lint-reports
          path: |
            target/checkstyle-result.xml
            target/spotbugsXml.xml
          if-no-files-found: ignore

  frontend:
    name: Lint Frontend
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web-src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      # type check runs in ci.yml (Build Frontend)

      - name: ESLint (incl. eslint-plugin-security)
        id: eslint
        continue-on-error: true # TODO: remove to make blocking
        run: npm run lint

      - name: Prettier
        id: prettier
        continue-on-error: true # TODO: remove to make blocking
        run: npm run format:check

      - name: npm audit (production dependencies)
        id: audit
        continue-on-error: true # TODO: remove to make blocking
        run: npm run audit

      - name: Summary
        if: always()
        run: |
          {
            echo "### Frontend static analysis"
            echo "| Check | Result |"
            echo "| --- | --- |"
            echo "| ESLint | ${{ steps.eslint.outcome }} |"
            echo "| Prettier | ${{ steps.prettier.outcome }} |"
            echo "| npm audit | ${{ steps.audit.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"
