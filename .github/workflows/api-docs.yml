name: API Docs

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: api-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  openapi:
    name: Check OpenAPI Specification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # starts the app and rewrites docs/api/openapi-generated.yaml; tests run in ci.yml
      - name: Generate OpenAPI specification
        run: ./mvnw -B -ntp -Popenapi verify -DskipTests

      - name: Check committed specification is up to date
        run: |
          if ! git diff --exit-code -- docs/api/openapi-generated.yaml; then
            echo "::error file=docs/api/openapi-generated.yaml::Specification is out of date. Run './mvnw -Popenapi verify' and commit the result."
            exit 1
          fi

      - name: Lint OpenAPI specification
        run: npx --yes @redocly/cli@2.60.0 lint --extends=minimal docs/api/openapi-generated.yaml
