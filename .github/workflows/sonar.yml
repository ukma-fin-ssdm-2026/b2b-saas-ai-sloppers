name: SonarQube Cloud

# CI-based analysis: Sonar gets compiled classes and dependency jars.
# No tests run here (they run in ci.yml), so no coverage is reported and the
# quality gate's coverage condition is skipped.
# Kept separate from ci.yml so that Sonar problems never affect the required CI checks.
# Requires Automatic Analysis to be OFF in SonarQube Cloud (Administration -> Analysis Method)
# and a SONAR_TOKEN repository secret.

# DISABLED until Automatic Analysis is switched off (needs org admin rights).
# To enable: replace `workflow_dispatch:` with the commented triggers and remove `if: false` from the job.
#   push:
#     branches:
#       - main
#   pull_request:
#     branches:
#       - main
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sonar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sonar:
    name: SonarQube Cloud Analysis
    if: false # disabled, see the note above `on:`
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for New Code detection and blame

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # test-compile gives Sonar the bytecode (main + test); the plugin passes dependency jars itself.
      # Only the listed sources are analyzed, so generated/committed artifacts
      # (docs/**, web-src/coverage/**, dist, target, node_modules) stay out of the analysis.
      - name: Compile and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          ./mvnw -B -ntp test-compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dcheckstyle.skip
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization=ukma-fin-ssdm-2026
          -Dsonar.projectKey=ukma-fin-ssdm-2026_b2b-saas-ai-sloppers
          -Dsonar.sources=pom.xml,src/main,web-src/src
          -Dsonar.tests=src/test,web-src/src
          -Dsonar.test.inclusions=src/test/**,web-src/src/**/*.test.ts,web-src/src/**/*.test.tsx,web-src/src/test/**
          -Dsonar.exclusions=web-src/src/**/*.test.ts,web-src/src/**/*.test.tsx,web-src/src/test/**,**/*.d.ts
