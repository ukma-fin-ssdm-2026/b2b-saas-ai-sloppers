name: Build and Deploy

# Run by hand on main: build images, push them to GHCR and commit
# infra/kube with image digests to the generated deploy branch (ADR-004 p.6).
# ArgoCD watches deploy and applies the change by itself.

on:
  workflow_dispatch:
  # TEMPORARY: workflow_dispatch needs the file on main, this allows a first run before the merge.
  # Remove before merging to main.
  push:
    branches: [feat/add-deployments]

permissions:
  contents: write # push to the deploy branch
  packages: write # push to GHCR

# queue instead of cancel: a half-finished run must not lose the newest commit
concurrency:
  group: build-and-deploy
  cancel-in-progress: false

env:
  REGISTRY_PATH: ghcr.io/ukma-fin-ssdm-2026/b2b-saas-ai-sloppers
  SOURCE_SHA: ${{ github.sha }}

jobs:
  deploy:
    name: Build images and update deploy branch
    # the run form lets you pick any branch. TEMPORARY: keep only main after the merge
    if: >-
      github.ref == 'refs/heads/main' ||
      github.ref == 'refs/heads/feat/add-deployments'
    runs-on: [self-hosted, linux]
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # multi-arch images: the cluster runs on arm64 and amd64 laptops.
      # No QEMU: build stages run natively, final stages have no RUN.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend
        id: backend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/main/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY_PATH }}/backend:${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Build frontend
        id: frontend
        uses: docker/build-push-action@v7
        with:
          context: web-src
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY_PATH }}/frontend:${{ env.SOURCE_SHA }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max

      - name: Build migrations
        id: migrations
        uses: docker/build-push-action@v7
        with:
          context: infra/migrations
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY_PATH }}/migrations:${{ env.SOURCE_SHA }}

      - name: Render manifests
        env:
          BACKEND_DIGEST: ${{ steps.backend.outputs.digest }}
          FRONTEND_DIGEST: ${{ steps.frontend.outputs.digest }}
          MIGRATIONS_DIGEST: ${{ steps.migrations.outputs.digest }}
        run: |
          render="$RUNNER_TEMP/kube"
          rm -rf "$render"
          cp -r infra/kube "$render"
          find "$render" -name '*.yaml' -exec sed -i \
            -e "s#$REGISTRY_PATH/backend:local#$REGISTRY_PATH/backend@$BACKEND_DIGEST#" \
            -e "s#$REGISTRY_PATH/frontend:local#$REGISTRY_PATH/frontend@$FRONTEND_DIGEST#" \
            -e "s#$REGISTRY_PATH/migrations:local#$REGISTRY_PATH/migrations@$MIGRATIONS_DIGEST#" \
            -e "s#community/migrations-digest: local#community/migrations-digest: \"$MIGRATIONS_DIGEST\"#" \
            {} +
          if grep -rnE "$REGISTRY_PATH/[a-z]+:local|migrations-digest: local" "$render"; then
            echo "::error::manifests still reference local images"
            exit 1
          fi

      - name: Commit to deploy branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin deploy > /dev/null; then
            git fetch origin deploy
            git checkout -B deploy FETCH_HEAD
          else
            git checkout --orphan deploy
          fi
          # deploy holds generated manifests only, the source stays on main
          git rm -rfq --ignore-unmatch .
          git clean -ffdxq
          mkdir -p infra
          cp -r "$RUNNER_TEMP/kube" infra/kube
          git add infra/kube
          if git diff --cached --quiet; then
            echo "Manifests did not change, nothing to deploy"
            exit 0
          fi
          git commit -m "deploy $SOURCE_SHA"
          git push origin deploy
