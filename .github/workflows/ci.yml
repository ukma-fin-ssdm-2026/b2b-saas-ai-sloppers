name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test Backend
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # linters run in lint.yml
      - name: Compile
        run: ./mvnw -B -ntp test-compile

      # unit tests + JaCoCo report and coverage threshold (see pom.xml)
      - name: Run backend tests
        run: ./mvnw -B -ntp test

      - name: Package
        run: ./mvnw -B -ntp package -DskipTests -Dcheckstyle.skip -Dspotbugs.skip

      - name: Test summary
        if: always()
        run: |
          shopt -s nullglob
          reports=(target/surefire-reports/TEST-*.xml)
          {
            echo "## Backend tests"
            if [ ${#reports[@]} -eq 0 ]; then
              echo "No test reports found."
              exit 0
            fi
            # count elements: for @Nested classes the testsuite attributes are 0
            count() { cat "${reports[@]}" | grep -o "<$1[ />]" | wc -l | tr -d ' '; }
            echo "| Tests | Failures | Errors | Skipped |"
            echo "|---|---|---|---|"
            echo "| $(count testcase) | $(count failure) | $(count error) | $(count skipped) |"
            if [ -f target/site/jacoco/jacoco.csv ]; then
              # columns 8/9: LINE_MISSED, LINE_COVERED
              LC_ALL=C awk -F, 'NR > 1 { m += $8; c += $9 } END { printf "\nLine coverage: **%.1f%%** (threshold 5%%)\n", 100 * c / (m + c) }' target/site/jacoco/jacoco.csv
              # per class, least covered first; columns 6/7: BRANCH_MISSED, BRANCH_COVERED
              echo
              echo "| Class | Lines | Branches |"
              echo "|---|---|---|"
              LC_ALL=C awk -F, 'NR > 1 && $8 + $9 > 0 {
                  cls = $2 "." $3; sub(/^ua\.edu\.ukma\.community\./, "", cls)
                  b = $6 + $7 > 0 ? sprintf("%.0f%%", 100 * $7 / ($6 + $7)) : "—"
                  printf "%.1f\t| %s | %.0f%% (%d/%d) | %s |\n", 100 * $9 / ($8 + $9), cls, 100 * $9 / ($8 + $9), $9, $8 + $9, b
                }' target/site/jacoco/jacoco.csv | LC_ALL=C sort -n | cut -f2-
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: target/*.jar
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Build and Test Frontend
    runs-on: [self-hosted, linux]
    timeout-minutes: 15

    defaults:
      run:
        working-directory: web-src

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      # unit tests (Vitest) — mirrors backend Surefire; coverage floor 5% like jacoco-check
      - name: Run frontend tests
        run: npm run test:coverage

      # tsc -b (type check) + vite build
      - name: Build
        run: npm run build

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web-src/dist/
          if-no-files-found: error
          retention-days: 7
