apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://github.com/ukma-fin-ssdm-2026/b2b-saas-ai-sloppers.git
    # generated by CI: manifests from main with image digests (ADR-004 p.6)
    targetRevision: deploy
    path: infra/kube/Services/Backend
    # database/ (Cluster, migrate Job) is part of this Application:
    # sync waves only order resources inside one Application
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    # the Cluster CRD may not exist yet on the very first sync
    syncOptions:
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
