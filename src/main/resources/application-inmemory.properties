# Profile without a database: in-memory repositories with demo data.
# Used for OpenAPI generation (-Popenapi) and quick local runs:
#   ./mvnw spring-boot:run -Dspring-boot.run.profiles=inmemory
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
# no DataSource, so no "db" health contributor for the readiness group
management.endpoint.health.group.readiness.include=readinessState
