spring.application.name=ai-slop-student-community
springdoc.writer-with-order-by-keys=true

# PostgreSQL: SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD from the environment (.env, docker-compose)

# Images: Supabase Storage, public bucket "images"
storage.supabase.url=${SUPABASE_URL:}
storage.supabase.secret-key=${SUPABASE_SECRET_KEY:}
storage.supabase.bucket=${SUPABASE_BUCKET:images}
# keep in sync with ImageService.MAX_BYTES
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Auth (C-03): JWT, Global Admin, verification codes
auth.jwt-secret=${AUTH_JWT_SECRET:}
auth.token-ttl=60m
auth.admin-emails=${AUTH_ADMIN_EMAILS:}
auth.mail-from=${MAIL_FROM:}

# SMTP for verification codes. Required outside profiles dev/test/inmemory (Lab 09 R5: fail fast).
# In those stub profiles only, missing host writes the code to the backend log.
# Gmail: SPRING_MAIL_HOST=smtp.gmail.com, SPRING_MAIL_PORT=587, username = address, password = app password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Health probes for Kubernetes: /actuator/health/liveness and /readiness.
# Liveness ignores the database (a failover must not restart the pod), readiness waits for it.
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
# /actuator/health shows each component's status (db, storage, mail, ...) but never details or errors.
# The storage component is deliberately not in readiness: without Supabase the site still works.
management.endpoint.health.show-components=always
management.endpoint.health.show-details=never
# the endpoint is public and calls Supabase, so cache the result instead of hitting it on every request
management.endpoint.health.cache.time-to-live=5s
